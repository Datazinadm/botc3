
name: VPS Root SSH via Tailscale

on:
  workflow_dispatch:

jobs:
  ssh-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Preparar VPS com acesso ROOT
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server

          echo "root:${VPS_PASSWORD}" | sudo chpasswd

          sudo mkdir -p /etc/ssh/sshd_config.d

          sudo tee /etc/ssh/sshd_config.d/99-root.conf <<EOF
          PermitRootLogin yes
          PasswordAuthentication yes
          PubkeyAuthentication yes
          EOF

          sudo systemctl restart ssh

        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}

      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Informações da VPS
        run: |
          echo "====== VPS ROOT ONLINE ======"
          echo "IP:"
          tailscale ip -4

          echo "CPU:"
          nproc

          echo "RAM:"
          free -h

          echo "ARMAZENAMENTO:"
          df -h /

          echo "USUARIO:"
          whoami

          echo "============================="

      - name: Manter VPS ligada
        run: |
          sleep 21000
